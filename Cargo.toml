[package]
name = "rdns"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.89"
clap = { version = "4.5.45", features = ["derive"] }
dns-message-parser = "0.8.0" 
futures = "0.3.31" 
futures-util = "0.3.31"
hickory-client = "0.25.2"
hickory-proto = { version = "0.25.2", features = ["tls-ring","https-ring"] }
hickory-server = "0.25.2"
moka = { version = "0.12.10", features = ["sync"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring","tls12","logging"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.33"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
url = "2.5.4"
webpki-roots = "1.0.2"
chrono = "0.4.41"
chrono-tz= "0.10.4"