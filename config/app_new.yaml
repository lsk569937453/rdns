# MosDNS-like DNS Proxy 配置文件 (Rust版)

# 全局设置
global:
  listen_address: "0.0.0.0:53" # DNS 服务监听地址和端口
  log_level: "info" # 日志级别, 可选: "trace", "debug", "info", "warn", "error"

# 核心处理流程
# 定义插件的执行顺序。请求将按照这个列表的顺序依次通过每个插件。
# 要禁用某个插件，只需将其从这个列表中移除或注释掉。
pipeline:
  - client_limiter # 首先进行客户端QPS限制
  - cache # 然后查找缓存
  - hosts # 接着检查 hosts 记录
  - blackhole # 检查是否需要屏蔽
  - redirect # 检查是否需要重定向
  - _prefer_ipv4 # 屏蔽 IPv6 (如果需要)
  - ecs # 添加 ECS 信息
  - padding # 对加密DNS报文进行填充
  - bufsize # 修改 EDNS0 UDP Size
  - ttl # 最后转发前修改 TTL
  - fast_forward # 最后将请求转发到上游

# -----------------------------------------------------------------------------
# 插件具体配置
# -----------------------------------------------------------------------------

# fast_forward: 请求转发插件
fast_forward:
  # 上游 DNS 服务器列表。支持 udp, tcp, tls (DoT), https (DoH) 格式。
  upstreams:
    - "8.8.8.8:53"
    - "1.1.1.1:53"
    - "tls://dns.google"
    - "https://cloudflare-dns.com/dns-query"
  # 转发策略, 可选: "random", "round_robin", "fastest"
  strategy: "random"

# cache: 缓存插件
cache:
  enabled: true
  # 缓存后端类型, 可选: "memory", "redis"
  backend: "memory"
  # 对于 "memory" 后端, 表示最大缓存条目数
  max_size: 10000
  # 是否覆盖上游返回的TTL
  ttl_override: true
  min_ttl: 300 # 最小TTL (秒)
  max_ttl: 3600 # 最大TTL (秒)
  # Redis 配置 (仅当 backend: "redis" 时生效)
  redis:
    url: "redis://127.0.0.1:6379/0"

# _prefer_ipv4: IPv4 偏好插件 (屏蔽 AAAA 请求)
_prefer_ipv4:
  enabled: false

# _prefer_ipv6: IPv6 偏好插件 (屏蔽 A 请求)
_prefer_ipv6:
  enabled: false

# ecs: EDNS Client Subnet 插件
ecs:
  enabled: true
  # ECS 添加策略, 可选: "auto", "preset"
  # "auto": 自动使用客户端的源 IP
  # "preset": 使用下面预设的 IP
  strategy: "auto"
  preset_ip: "1.2.3.4" # 当 strategy = "preset" 时生效
  subnet_mask_ipv4: 24
  subnet_mask_ipv6: 56

# hosts: 静态域名记录插件
hosts:
  enabled: true
  # 格式: "域名": "IP地址" 或 ["IP地址1", "IP地址2"]
  records:
    example.com: "192.168.1.1"
    multi.example.com:
      - "192.168.1.2"
      - "192.168.1.3"
    ipv6.example.com: "::1"

# blackhole: 黑洞/屏蔽插件
blackhole:
  enabled: true
  # 屏蔽策略, 可选: "drop", "empty", "custom_ip"
  # "drop": 直接丢弃应答
  # "empty": 返回空的 NOERROR 应答
  # "custom_ip": 返回下面指定的IP地址
  strategy: "empty"
  custom_ips: ["0.0.0.0", "::"] # 当 strategy = "custom_ip" 时生效
  domains:
    - "ads.example.com"
    - "tracking.example.net"

# ttl: TTL 修改插件
ttl:
  enabled: true
  # 规则格式: "域名": TTL值(秒)
  # "*" 代表所有域名
  rules:
    "*": 600
    "specific.domain.com": 3600

# redirect: 请求重定向插件
redirect:
  enabled: true
  # 格式: "原始请求域名": "目标域名"
  rules:
    google.com: "www.google.com"
    a.example.com: "b.example.com"

# padding: EDNS(0) Padding 插件 (主要用于 DoH/DoT)
padding:
  enabled: false
  # 将报文填充到这个长度的整数倍, 例如 128, 256
  block_size: 128

# bufsize: EDNS(0) UDP Buffer Size 修改插件
bufsize:
  enabled: false
  # 建议值 1232, 以避免IP分片
  size: 1232

# arbitrary: 高级自定义应答插件
arbitrary:
  enabled: false
  # 这是一个高级功能，配置格式可能比较复杂
  rules:
    - domain: "example.org"
      qtype: "A"
      value: "10.0.0.1"
      ttl: 60
    - domain: "example.org"
      qtype: "TXT"
      value: "Hello from my DNS proxy!"
      ttl: 60

# reverse_lookup: 反向查询插件
reverse_lookup:
  enabled: false
  http_api:
    enabled: true
    listen_address: "127.0.0.1:8080"
  ptr_lookup:
    enabled: true

client_limiter:
  enabled: true
  max_qps: 100
  burst_size: 20
